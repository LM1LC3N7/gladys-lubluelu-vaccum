# -----------------------------------------------------------------------------
# Dependabot version updates.
#
# Opens a PR by itself when a newer version of a dependency is available, for
# the four places this repo pins versions: npm packages, the Python bridge's
# requirements.txt (bridge/tuya_bridge.py's only dependency surface, most
# importantly the official `tuya-device-sharing-sdk`), the Dockerfile base
# image, and the GitHub Actions used by the workflows. Regression checking is
# the existing CI workflow (.github/workflows/ci.yml) — its "Python bridge"
# job installs the bumped requirements.txt for real and imports
# bridge/tuya_bridge.py against it, so a Tuya SDK release that renames/removes
# something this bridge relies on fails CI on the PR itself instead of only
# being discovered at runtime. .github/workflows/dependabot-auto-merge.yml
# then merges a pip PATCH bump on its own once that CI run is green (see that
# workflow's header for exactly what it does and does not auto-merge).
#
# `target-branch: main` is set explicitly on every entry below: this repo's
# GitHub "default branch" setting is (still, as of this writing) pointed at a
# feature branch rather than `main` (Settings -> General -> Default branch
# fixes that, but no API available here can do it), and Dependabot targets
# the repository's default branch when this key is absent. Pinning `main`
# here keeps every future PR correctly aimed regardless of that setting.
# -----------------------------------------------------------------------------
version: 2
updates:
  - package-ecosystem: 'pip'
    directory: '/bridge'
    target-branch: 'main'
    schedule:
      interval: 'weekly'
    labels:
      - 'dependencies'
      - 'python-bridge'
    commit-message:
      prefix: 'chore'
      include: 'scope'

  - package-ecosystem: 'npm'
    directory: '/'
    target-branch: 'main'
    schedule:
      interval: 'weekly'
    open-pull-requests-limit: 5
    groups:
      dev-dependencies:
        dependency-type: 'development'
    labels:
      - 'dependencies'
    commit-message:
      prefix: 'chore'
      include: 'scope'

  - package-ecosystem: 'docker'
    directory: '/'
    target-branch: 'main'
    schedule:
      interval: 'weekly'
    labels:
      - 'dependencies'
    commit-message:
      prefix: 'chore'
      include: 'scope'

  - package-ecosystem: 'github-actions'
    directory: '/'
    target-branch: 'main'
    schedule:
      interval: 'weekly'
    labels:
      - 'dependencies'
    commit-message:
      prefix: 'chore'
      include: 'scope'
