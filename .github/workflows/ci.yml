# -----------------------------------------------------------------------------
# Continuous integration: runs on every push and every pull request.
#
# Three independent jobs:
#   1. quality        -> Prettier, ESLint, `node --test` (no extra dependency).
#      `npm test` only exercises bridge/tuya_bridge.py's *protocol* against a
#      plain-Node fixture (test-fixtures/echoBridge.js), never the real
#      `tuya_sharing` package, so it cannot by itself catch a Tuya SDK release
#      that breaks this bridge's usage of it - that's job 2 below.
#   2. python-bridge  -> installs bridge/requirements.txt for real and imports
#      bridge/tuya_bridge.py against the actual installed `tuya-device-sharing-sdk`.
#      This is what makes a Dependabot bump of that SDK (see
#      .github/dependabot.yml's `pip` entry) trustworthy to merge: an SDK
#      release that renames/removes LoginControl/Manager/SharingTokenListener,
#      or a status_range/local_strategy field _serialize_device relies on,
#      fails right here instead of only being discovered against a real
#      vacuum. dependabot-auto-merge.yml only merges once this job is green.
#   3. docker         -> `docker build .`, no push. Without this job a
#      Dockerfile change (base image bump, a COPY typo...) goes green on
#      `quality` alone and is only ever actually built the day someone cuts a
#      release — this catches it on every PR instead.
#
# Runs on Node 22, the version the Docker image ships with (see the
# Dockerfile), so the check exercises the exact runtime the integration runs on.
# -----------------------------------------------------------------------------
name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    name: Lint & test
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check formatting (Prettier)
        run: npm run format:check

      - name: Lint (ESLint)
        run: npm run lint

      - name: Run tests
        run: npm test

  python-bridge:
    runs-on: ubuntu-latest
    name: Python bridge (real SDK)
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: bridge/requirements.txt

      - name: Install bridge dependencies
        run: pip install --no-cache-dir -r bridge/requirements.txt

      - name: Byte-compile the bridge
        run: python3 -m py_compile bridge/tuya_bridge.py

      - name: Smoke-import against the installed SDK
        run: |
          python3 - <<'PY'
          import sys

          sys.path.insert(0, "bridge")
          import tuya_bridge  # the import line itself IS the check: it fails
          # immediately if the installed tuya-device-sharing-sdk no longer
          # exposes LoginControl/Manager/SharingTokenListener the way this
          # bridge expects.

          # COMMANDS is the bridge's entire stdin/stdout protocol surface
          # (src/tuya/pythonBridge.js calls each of these by name) - confirm
          # none silently disappeared, e.g. from a refactor alongside the
          # dependency bump.
          expected = {
              "qr_start",
              "qr_poll",
              "restore_session",
              "get_session",
              "logout",
              "discover",
              "send_command",
          }
          missing = expected - set(tuya_bridge.COMMANDS)
          assert not missing, f"bridge/tuya_bridge.py is missing commands: {missing}"

          import tuya_sharing

          print(
              "tuya_bridge imports cleanly against tuya-device-sharing-sdk",
              getattr(tuya_sharing, "__version__", "(version unknown)"),
          )
          PY

  docker:
    runs-on: ubuntu-latest
    name: Docker build
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build the image (no push)
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
