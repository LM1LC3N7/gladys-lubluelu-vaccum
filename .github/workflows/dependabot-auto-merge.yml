# -----------------------------------------------------------------------------
# Auto-merge Dependabot's PATCH bumps of the Python bridge's dependencies
# (bridge/requirements.txt, most importantly the official
# `tuya-device-sharing-sdk`) once CI is green — nothing else.
#
# Why patch only, and pip only: a pre-1.0 package (tuya-device-sharing-sdk is
# 0.x) can break its API on a MINOR bump too, so those - and every npm/docker/
# github-actions bump from the same .github/dependabot.yml - are left for a
# human to review and merge by hand, same as before this workflow existed.
# A patch release is the one case narrow enough to trust CI's word for it.
#
# "CI green" here specifically includes the "python-bridge" job in
# .github/workflows/ci.yml, which installs the bumped requirements.txt for
# real and imports bridge/tuya_bridge.py against it - an SDK patch release
# that still manages to remove/rename something this bridge depends on fails
# that job, and `gh pr merge --auto` then simply never fires (GitHub only acts
# on it once every required check has passed).
#
# This only flips the "auto-merge" switch on the PR - GitHub still waits for
# every required status check before actually merging, and still respects
# branch protection. The repository must have "Allow auto-merge" turned on
# under Settings -> General for this to have any effect; enabling it is a
# one-time repository setting, not something a workflow file can do on its
# own.
# -----------------------------------------------------------------------------
name: Dependabot auto-merge

on:
  pull_request:

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    if: github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Fetch Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@v3
        with:
          github-token: '${{ secrets.GITHUB_TOKEN }}'

      - name: Enable auto-merge for pip patch updates
        if: |
          steps.metadata.outputs.package-ecosystem == 'pip' &&
          steps.metadata.outputs.update-type == 'version-update:semver-patch'
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh pr merge --auto --squash "$PR_URL"
